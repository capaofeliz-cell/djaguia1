<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1428">
  <title>Página não encontrada (404) | Pastor Virtual</title>
  <meta name="description" content="A página que você procura não foi encontrada. Volte ao Pastor Virtual, leia notícias gospel ou entre em contato.">
  <meta name="robots" content="noindex, follow">
  <style>
    :root {
      color-scheme: light;
      --navy: #0A1428;
      --navy-light: #142541;
      --gold: #D7B56D;
      --paper: #F7F5EF;
      --ink: #172238;
      --muted: #667085;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 0%, #203454 0, var(--navy) 65%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: min(760px, 100%);
      overflow: hidden;
      border: 1px solid rgba(215,181,109,.52);
      border-radius: 24px;
      background: var(--paper);
      box-shadow: 0 28px 90px rgba(0,0,0,.38);
    }
    .scene {
      display: block;
      width: 100%;
      height: auto;
      background: #9fc6ce;
    }
    .copy {
      padding: 28px 32px 34px;
      text-align: center;
    }
    .brand {
      margin: 0 0 8px;
      color: #94763b;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 6vw, 46px);
      line-height: 1.12;
    }
    .message {
      max-width: 510px;
      margin: 13px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }
    .actions {
      margin-top: 23px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 11px;
    }
    .button {
      min-height: 46px;
      padding: 12px 19px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--navy);
      border-radius: 999px;
      background: var(--navy);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease;
    }
    .button:hover { transform: translateY(-2px); background: var(--navy-light); }
    .button.secondary { background: transparent; color: var(--navy); }
    .button.secondary:hover { background: #ebe8df; }
    .footer {
      margin-top: 23px;
      color: #737b87;
      font-size: 13px;
    }
    .footer a { color: #806633; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

    /* O personagem começa olhando para o lado e, ao abrir, volta o olhar para você. */
    .pupils {
      transform-box: fill-box;
      transform-origin: center;
      animation: look-at-camera 1.05s cubic-bezier(.2,.8,.3,1) .35s both;
    }
    @keyframes look-at-camera {
      0% { transform: translate(-2.5px, 0); }
      58% { transform: translate(2px, .4px); }
      78% { transform: translate(-.7px, 0); }
      100% { transform: translate(0, 0); }
    }
    .water-glimmer { animation: shimmer 3.2s ease-in-out infinite alternate; }
    @keyframes shimmer { from { opacity: .35; } to { opacity: .8; } }

    @media (max-width: 560px) {
      body { padding: 14px; }
      .card { border-radius: 18px; }
      .copy { padding: 24px 20px 28px; }
      .message { font-size: 15px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
