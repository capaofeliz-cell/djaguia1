title: "Pastor Virtual"
description: "Pastor Virtual — respostas acolhedoras baseadas na Palavra de Deus."
url: "https://djrenatobravo.com.br"
markdown: kramdown

collections:
  top5:
    output: true
    permalink: /noticias/top5/:slug/
  videos:
    output: true
    permalink: /noticias/videos/:slug/
  fotos:
    output: true
    permalink: /noticias/fotos/:slug/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "top5"
    values:
      layout: "top5"
  - scope:
      path: ""
      type: "videos"
    values:
      layout: "video"
  - scope:
      path: ""
      type: "fotos"
    values:
      layout: "foto"

exclude:
  - README.md
