
---
layout: base
---
<article class="card">
  <span class="badge">Vídeo</span>
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: '%d/%m/%Y' }}</div>
  {% if page.embed_html %}
    <div class="video-embed">{{ page.embed_html }}</div>
  {% elsif page.youtube_id %}
    <div class="video-embed" style="position:relative;padding-top:56.25%">
      <iframe src="https://www.youtube.com/embed/{{ page.youtube_id }}" style="position:absolute;top:0;left:0;width:100%;height:100%" allowfullscreen></iframe>
    </div>
  {% endif %}
  <div class="post-body">{{ content }}</div>
</article>
<p><a href="/noticias/">← Voltar para todas as notícias</a></p>
