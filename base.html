<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Notícias Gospel | DJ ÁGUIA1</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" type="image/png" href="/icons/icon-32.png?v=3">
<style>
:root{--cream:#fbfaf6;--paper:#fffefa;--gold:#b97845;--gold2:#d19a69;--brown:#5f554e;--ink:#2f3430;--muted:#646963;--line:#e6e2d9}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:500;line-height:1.6}
a{color:var(--gold)}
.wrap{width:min(900px,calc(100% - 32px));margin:auto}
header.site{position:sticky;top:0;z-index:10;background:rgba(255,250,240,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 0}
header.site .wrap{display:flex;align-items:center;gap:14px}
header.site img{width:40px;height:40px;border-radius:50%;object-fit:cover}
header.site h1{font:700 18px Georgia,serif;margin:0;color:#a86b0d}
header.site nav{margin-left:auto;display:flex;gap:16px;font-size:13px;font-weight:700}
main{padding:32px 0 60px}
footer.site{padding:26px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 24px #6c4b1508}
.card h2,.card h3{margin-top:0}
.card img{max-width:100%;border-radius:10px}
.meta{color:var(--muted);font-size:12px;margin-bottom:6px}
.badge{display:inline-block;background:#fff3d9;color:#a66c14;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;margin-bottom:8px}
.grid{display:grid;gap:16px}
@media(min-width:700px){.grid.cols-2{grid-template-columns:1fr 1fr}}
.btn{display:inline-block;background:var(--gold);color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px}
iframe{max-width:100%;border-radius:10px;border:none}
ol.top5{counter-reset:top5;list-style:none;padding:0}
ol.top5 li{counter-increment:top5;position:relative;padding:16px 16px 16px 56px;background:var(--paper);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
ol.top5 li::before{content:counter(top5);position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
</style>
</head>
<body>
<header class="site">
  <div class="wrap">
    <img src="/imagens/avatar.jpg" alt="DJ ÁGUIA1">
    <h1>Notícias Gospel</h1>
    <nav>
      <a href="/">← Pastor Virtual</a>
      <a href="/noticias/">Notícias</a>
    </nav>
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer class="site">
  <div class="wrap">© {{ site.time | date: '%Y' }} DJ ÁGUIA1 — Conteúdo gospel. <a href="/privacidade/">Política de Privacidade</a></div>
</footer>
</body>
</html>
