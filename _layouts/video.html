---
layout: base
---
<article class="card">
  <span class="badge">Vídeo</span>
  <h1>{{ page.title }}</h1>
  <div class="meta">{{ page.date | date: '%d/%m/%Y' }}</div>
  {% if page.youtube_id %}
  <iframe width="100%" height="380" src="https://www.youtube.com/embed/{{ page.youtube_id }}" allowfullscreen></iframe>
  {% elsif page.embed_html %}
  {{ page.embed_html }}
  {% endif %}
  <div class="post-body">{{ content }}</div>
</article>
<p><a href="/noticias/videos/">← Voltar para todos os vídeos</a></p>
